# henmedia fork only: regenerate the facade and build the npm package for
# layerling, on a side branch so nothing here reaches the upstream PR.
name: layerling build

on:
  push:
    branches: [layerling-build]
  workflow_dispatch:

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate facade
        run: |
          cargo xtask codegen
          cargo fmt --all
          git diff --binary > codegen.patch
          git status --short
      - uses: actions/upload-artifact@v4
        with:
          name: codegen-patch
          path: codegen.patch

  build:
    needs: codegen
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andymai/occt-wasm-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: codegen-patch
      - name: Apply generated facade
        run: |
          git config --global --add safe.directory '*'
          if [ -s codegen.patch ]; then git apply codegen.patch; fi
          rm -f codegen.patch
      - name: Link pre-built OCCT libs
        run: |
          cp -r /workspace/occt/build occt/build
          cp -r /workspace/3rdparty 3rdparty
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          npm ci
          cd ts && npm ci
      - name: Build facade + link WASM (release)
        run: cargo xtask build --release
      - name: Build TypeScript
        run: |
          cd ts
          npm run build
          cp ../dist/occt-wasm.js ../dist/occt-wasm.wasm dist/
      - name: Run tests
        run: npx vitest run
      - name: Pack npm tarball
        run: |
          cd ts
          npm pack
          ls -la *.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: occt-wasm-layerling
          path: |
            ts/*.tgz
            ts/dist/
